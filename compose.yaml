name: fluxguard

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://fluxguard:fluxguard_local_only@postgres:5432/fluxguard}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
  KAFKA_ORDERS_TOPIC: ${KAFKA_ORDERS_TOPIC:-orders.created.v1}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-fluxguard-order-projection-v1}
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  INCIDENT_API_ENABLED: ${INCIDENT_API_ENABLED:-false}
  FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-false}
  CONSUMER_RETRY_INCIDENT_THRESHOLD: ${CONSUMER_RETRY_INCIDENT_THRESHOLD:-3}
  OUTBOX_FAILURE_INCIDENT_THRESHOLD: ${OUTBOX_FAILURE_INCIDENT_THRESHOLD:-3}
  INVESTIGATION_API_ENABLED: ${INVESTIGATION_API_ENABLED:-false}
  RECOVERY_API_ENABLED: ${RECOVERY_API_ENABLED:-false}
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  INVESTIGATION_MODEL_ID: ${INVESTIGATION_MODEL_ID:-nvidia/nemotron-3.5-super-vl:free}
  GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-3.5-flash-lite}
  INVESTIGATION_ALLOW_PAID_MODELS: ${INVESTIGATION_ALLOW_PAID_MODELS:-false}
  INVESTIGATION_MAX_LLM_CALLS: ${INVESTIGATION_MAX_LLM_CALLS:-4}
  INVESTIGATION_MAX_ITERATIONS: ${INVESTIGATION_MAX_ITERATIONS:-2}

x-app: &app
  build: .
  environment: *app-environment
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redpanda:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512M

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxguard}
      POSTGRES_USER: ${POSTGRES_USER:-fluxguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxguard_local_only}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && uvicorn fluxguard.apps.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  outbox:
    <<: *app
    command: ["python", "-m", "fluxguard.apps.worker.outbox"]
    depends_on:
      api:
        condition: service_healthy

  consumer:
    <<: *app
    command: ["python", "-m", "fluxguard.apps.worker.consumer"]
    depends_on:
      api:
        condition: service_healthy

  investigator:
    <<: *app
    command: ["python", "-m", "fluxguard.apps.worker.investigator"]
    environment:
      <<: *app-environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      INVESTIGATION_REQUEST_TIMEOUT_SECONDS: ${INVESTIGATION_REQUEST_TIMEOUT_SECONDS:-30}
      INVESTIGATION_MAX_RETRIES: ${INVESTIGATION_MAX_RETRIES:-2}
      INVESTIGATION_EVIDENCE_LIMIT: ${INVESTIGATION_EVIDENCE_LIMIT:-50}
      INVESTIGATION_POLL_INTERVAL_SECONDS: ${INVESTIGATION_POLL_INTERVAL_SECONDS:-2}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redpanda_data:
