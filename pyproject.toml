[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxguard"
version = "0.1.0"
description = "Invariant-aware recovery platform for distributed data pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "confluent-kafka==2.8.2",
  "fastapi==0.115.12",
  "google-genai==1.75.0",
  "httpx==0.28.1",
  "langgraph==1.2.17",
  "psycopg[binary]==3.2.6",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "sqlalchemy==2.0.40",
  "structlog==25.2.0",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.6",
]

[project.scripts]
fluxguard-outbox = "fluxguard.apps.worker.outbox:main"
fluxguard-consumer = "fluxguard.apps.worker.consumer:main"
fluxguard-investigator = "fluxguard.apps.worker.investigator:main"
fluxguard-evaluate-investigations = "fluxguard.apps.evaluate_investigations:main"

[tool.setuptools.packages.find]
include = ["fluxguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = ["integration: requires PostgreSQL and Redpanda"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.coverage.run]
source = ["fluxguard"]
branch = true
